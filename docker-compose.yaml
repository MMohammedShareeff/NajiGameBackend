services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naji-app
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/NajiDB
      SPRING_DATASOURCE_USERNAME: Naji
      SPRING_DATASOURCE_PASSWORD: NajiTheGame
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: bmFqaUdhbWVTZWNyZXRzdXJ2aXZhbGtlZXBzZWNyZXQyMDI0c1VtbWVyT25saW5lTXVsdGlQbEF5ZXJHYW1laW50ZXJuc2hpcA==
      JWT_EXPIRATION_MS: 86400000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    container_name: naji-db
    environment:
      POSTGRES_DB: NajiDB
      POSTGRES_USER: Naji
      POSTGRES_PASSWORD: NajiTheGame
    ports:
      - "2004:5432"
    volumes:
      - naji-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U Naji -d NajiDB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: naji-redis
    ports:
      - "6379:6379"

volumes:
  naji-data: