springdoc:
  show-actuator: true
spring:
  application:
    name: naji
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:2004/NajiDB}
    username: ${SPRING_DATASOURCE_USERNAME:Naji}
    password: ${SPRING_DATASOURCE_PASSWORD:NajiTheGame}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
server:
  port: ${SERVER_PORT:8080}
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    redis:
      enabled: false
api:
  key: ${OPENAI_API_KEY:}
logging:
  level:
    org.springframework.security: debug
    org.springframework.validation: debug
