services:
  app:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: naji-app
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/NajiDB
      SPRING_DATASOURCE_USERNAME: Naji
      SPRING_DATASOURCE_PASSWORD: NajiTheGame
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    container_name: naji-db
    environment:
      POSTGRES_DB: NajiDB
      POSTGRES_USER: Naji
      POSTGRES_PASSWORD: NajiTheGame
    ports:
      - "2004:5432"
    volumes:
      - naji-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U Naji -d NajiDB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: naji-redis
    ports:
      - "6379:6379"

volumes:
  naji-data:
